# Alinhado ao padrão Golden Image Node.js (simple-project-gi-nodejs)
# https://code.ifoodcorp.com.br/ifood/docker-images/golden/test-projects/simple-project-gi-nodejs
include:
  - project: ifood/pipelines/gitlab-pipelines
    ref: ifood-backend-2-stable
    file: pipelines/ifood-backend/main.yml

variables:
  SERVICE_NAME: dataviz-custom-charts
  GOLDEN_IMG_TAG: "1-edge"
  GOLDEN_IMG_NODE_VERSION: "18"
  BUILD_DOCKERFILE_PATH: $CI_PROJECT_DIR/Dockerfile
  BUILD_ARGS: "GOLDEN_IMG_TAG=$GOLDEN_IMG_TAG GOLDEN_IMG_NODE_VERSION=$GOLDEN_IMG_NODE_VERSION"
  KUBERNETES_CLUSTER_SANDBOX: security-sandbox-use1-01
  KUBERNETES_CLUSTER_PRODUCTION: security-production-use1-01
  HELM_CHART: ifood-app
  KUBERNETES_NAMESPACE: dataviz
  DATADOG_DEFAULT_MONITOR: "false"

# Deploy via k8s-manifests (Argo); desabilita deploy automático desta pipeline
production_helm_dry_run:
  rules:
    - when: never

production:
  rules:
    - when: never

# Sem k8s/values-dev.yaml neste repo; deploy via k8s-manifests
sandbox_helm_dry_run:
  rules:
    - when: never

sandbox:
  rules:
    - when: never

# Repo Node-only, sem go.mod; sbom_scan_cli exige Go
sbom_scan_cli:
  rules:
    - when: never
  script: ["echo 'Job disabled for this repo'"]

# Repo não gera SBOM em sbom_files/; library_usage_publish exige esses arquivos
library_usage_publish:
  rules:
    - when: never
  script: ["echo 'Job disabled for this repo'"]

workflow:
  rules:
    - when: always
